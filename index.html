<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUTA NAKAHATA PORTFOLIO</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --text: #f0ece4;
    --accent: #c8b89a;
    --border: rgba(200, 184, 154, 0.25);
    --card-bg: #111111;
    --hover: rgba(200, 184, 154, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    padding: 80px 40px 60px;
    position: relative;
  }
  header::after {
    display: none;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2.8rem, 7vw, 6rem);
    letter-spacing: 0.15em;
    line-height: 1.15;
    color: var(--text);
    animation: fadeDown 1s ease both;
  }
  .subtitle {
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    color: var(--accent);
    margin-top: 16px;
    text-transform: uppercase;
    animation: fadeDown 1s 0.2s ease both;
  }

  /* ── MAIN ── */
  main {
    max-width: 1300px;
    margin: 0 auto;
    padding: 20px 40px 100px;
  }

  /* ── SECTION ── */
  .section {
    margin-bottom: 72px;
    animation: fadeUp 0.8s ease both;
  }
  .section:nth-child(2) { animation-delay: 0.15s; }
  .section:nth-child(3) { animation-delay: 0.3s; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 1.1rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text);
    white-space: nowrap;
  }
  .section-sub {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    opacity: 0.75;
  }
  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── GRID ── */
  .grid-6 {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  /* ── CARD ── */
  .card {
    position: relative;
    aspect-ratio: 16/10;
    background: var(--card-bg);
    border: 1px solid var(--border);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.3s, transform 0.3s;
    group: true;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  /* video/image inside card */
  .card video,
  .card img.media {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.4s;
  }

  /* empty state */
  .card-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    opacity: 0.35;
    transition: opacity 0.3s;
  }
  .card:hover .card-empty { opacity: 0.6; }
  .card-empty svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.5; }
  .card-empty span { font-size: 0.55rem; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; }

  /* overlay on hover (when media exists) */
  .card-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,10,10,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover .card-overlay { opacity: 1; }
  .card-overlay svg { width: 28px; height: 28px; stroke: var(--text); fill: none; stroke-width: 1.5; }

  /* ── EDIT PANEL ── */
  .edit-panel {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .edit-panel.open { display: flex; }
  .edit-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(6px);
  }
  .edit-box {
    position: relative;
    background: #141414;
    border: 1px solid var(--border);
    padding: 40px;
    width: min(480px, 90vw);
    animation: scaleIn 0.25s ease;
  }
  .edit-box h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 1.2rem;
    letter-spacing: 0.25em;
    margin-bottom: 6px;
    color: var(--text);
  }
  .edit-box p {
    font-size: 0.65rem;
    color: var(--accent);
    letter-spacing: 0.15em;
    margin-bottom: 28px;
    opacity: 0.75;
  }

  .input-group { margin-bottom: 20px; }
  .input-group label {
    display: block;
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .input-group input[type="text"],
  .input-group input[type="url"] {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-group input:focus { border-color: var(--accent); }

  .file-drop {
    border: 1px dashed var(--border);
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .file-drop:hover, .file-drop.dragover {
    border-color: var(--accent);
    background: var(--hover);
  }
  .file-drop input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .file-drop-text {
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    opacity: 0.7;
    pointer-events: none;
  }
  .file-drop-text strong { display: block; font-size: 0.8rem; margin-bottom: 4px; opacity: 1; }

  .btn-row { display: flex; gap: 10px; margin-top: 24px; }
  .btn {
    flex: 1;
    padding: 12px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    transition: all 0.2s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }
  .btn.primary:hover { background: #d4c4aa; }
  .btn.danger { border-color: #7a3030; color: #c47070; }
  .btn.danger:hover { background: #7a3030; color: var(--text); }

  .close-btn {
    position: absolute;
    top: 16px; right: 16px;
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 1.2rem;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .close-btn:hover { opacity: 1; }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 40px;
    border-top: 1px solid var(--border);
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: var(--accent);
    opacity: 0.5;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .grid-6 { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    main { padding: 20px 20px 80px; }
    .grid-6 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<header>
  <h1>YUTA NAKAHATA<br>PORTFOLIO</h1>
  <p class="subtitle">Film Director &amp; Visual Creator</p>
</header>

<main>

  <!-- MUSIC -->
  <section class="section" id="sec-music">
    <div class="section-header">
      <div>
        <div class="section-title">Music</div>
        <div class="section-sub">音楽系映像</div>
      </div>
      <div class="section-line"></div>
    </div>
    <div class="grid-6" id="grid-music"></div>
  </section>

  <!-- BUSINESS SNS -->
  <section class="section" id="sec-biz">
    <div class="section-header">
      <div>
        <div class="section-title">Business SNS</div>
        <div class="section-sub">企業向けSNS映像</div>
      </div>
      <div class="section-line"></div>
    </div>
    <div class="grid-6" id="grid-biz"></div>
  </section>

  <!-- AI-GENERATED MEDIA -->
  <section class="section" id="sec-ai">
    <div class="section-header">
      <div>
        <div class="section-title">AI-Generated Media</div>
        <div class="section-sub">AI生成コンテンツ・先進映像</div>
      </div>
      <div class="section-line"></div>
    </div>
    <div class="grid-3" id="grid-ai"></div>
  </section>

</main>

<footer>© YUTA NAKAHATA — ALL RIGHTS RESERVED</footer>

<!-- EDIT PANEL -->
<div class="edit-panel" id="editPanel">
  <div class="edit-backdrop" onclick="closePanel()"></div>
  <div class="edit-box">
    <button class="close-btn" onclick="closePanel()">✕</button>
    <h3>EDIT SLOT</h3>
    <p id="panelLabel">MUSIC — 01</p>

    <div class="input-group">
      <label>動画ファイル（MP4推奨）</label>
      <div class="file-drop" id="fileDrop">
        <input type="file" id="fileInput" accept="video/*,image/*" onchange="handleFile(this)">
        <div class="file-drop-text">
          <strong>クリックまたはドラッグ</strong>
          動画・画像をここに
        </div>
      </div>
    </div>

    <div class="input-group">
      <label>または外部URL（YouTube埋め込み等）</label>
      <input type="url" id="urlInput" placeholder="https://...">
    </div>

    <div class="input-group">
      <label>タイトル（任意）</label>
      <input type="text" id="titleInput" placeholder="作品タイトル">
    </div>

    <div class="btn-row">
      <button class="btn danger" onclick="clearSlot()">削除</button>
      <button class="btn" onclick="closePanel()">キャンセル</button>
      <button class="btn primary" onclick="saveSlot()">保存</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──
// Load from localStorage or init
const STORAGE_KEY = 'ynp_data_v1';
let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {
  music: Array(6).fill(null),
  biz:   Array(6).fill(null),
  ai:    Array(3).fill(null),
};

let activeSection = null;
let activeIndex   = null;

// ── BUILD GRIDS ──
function buildGrid(containerId, section, count) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  for (let i = 0; i < count; i++) {
    el.appendChild(makeCard(section, i));
  }
}

function makeCard(section, i) {
  const item = data[section][i];
  const card = document.createElement('div');
  card.className = 'card';
  card.onclick = () => openPanel(section, i);

  if (item && item.type === 'video') {
    const v = document.createElement('video');
    v.src = item.src;
    v.muted = true; v.loop = true; v.playsInline = true;
    v.addEventListener('mouseenter', () => v.play());
    v.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
    card.appendChild(v);
    card.appendChild(makeOverlay());
  } else if (item && item.type === 'image') {
    const img = document.createElement('img');
    img.src = item.src; img.className = 'media';
    card.appendChild(img);
    card.appendChild(makeOverlay());
  } else {
    card.appendChild(makeEmpty());
  }

  // label
  if (item && item.title) {
    const lbl = document.createElement('div');
    lbl.style.cssText = 'position:absolute;bottom:0;left:0;right:0;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,0.7));font-size:0.55rem;letter-spacing:0.15em;color:#f0ece4;opacity:0;transition:opacity 0.3s;pointer-events:none;';
    lbl.textContent = item.title;
    card.addEventListener('mouseenter', () => lbl.style.opacity = '1');
    card.addEventListener('mouseleave', () => lbl.style.opacity = '0');
    card.appendChild(lbl);
  }

  return card;
}

function makeEmpty() {
  const d = document.createElement('div');
  d.className = 'card-empty';
  d.innerHTML = `<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add Media</span>`;
  return d;
}

function makeOverlay() {
  const d = document.createElement('div');
  d.className = 'card-overlay';
  d.innerHTML = `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
  return d;
}

function renderAll() {
  buildGrid('grid-music', 'music', 6);
  buildGrid('grid-biz',   'biz',   6);
  buildGrid('grid-ai',    'ai',    3);
}

// ── PANEL ──
const sectionLabels = { music: 'MUSIC', biz: 'BUSINESS SNS', ai: 'AI-GENERATED MEDIA' };

function openPanel(section, index) {
  activeSection = section;
  activeIndex   = index;
  document.getElementById('panelLabel').textContent =
    `${sectionLabels[section]} — ${String(index + 1).padStart(2,'0')}`;
  document.getElementById('urlInput').value   = '';
  document.getElementById('titleInput').value = '';
  document.getElementById('fileInput').value  = '';

  const item = data[section][index];
  if (item) {
    if (item.src && item.type !== 'video' && item.type !== 'image') {
      document.getElementById('urlInput').value = item.src;
    }
    document.getElementById('titleInput').value = item.title || '';
  }

  document.getElementById('editPanel').classList.add('open');
}

function closePanel() {
  document.getElementById('editPanel').classList.remove('open');
  activeSection = null; activeIndex = null;
}

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const isVideo = file.type.startsWith('video/');
    data[activeSection][activeIndex] = {
      type: isVideo ? 'video' : 'image',
      src: e.target.result,
      title: document.getElementById('titleInput').value,
    };
    save(); renderAll(); closePanel();
  };
  reader.readAsDataURL(file);
}

function saveSlot() {
  const url   = document.getElementById('urlInput').value.trim();
  const title = document.getElementById('titleInput').value.trim();
  if (url) {
    data[activeSection][activeIndex] = { type: 'url', src: url, title };
  } else {
    if (title && data[activeSection][activeIndex]) {
      data[activeSection][activeIndex].title = title;
    }
  }
  save(); renderAll(); closePanel();
}

function clearSlot() {
  data[activeSection][activeIndex] = null;
  save(); renderAll(); closePanel();
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

// drag-drop styling
const drop = document.getElementById('fileDrop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const fakeInput = { files: [file] };
  document.getElementById('fileInput').files = e.dataTransfer.files;
  handleFile({ files: [file] });
});

// ── INIT ──
renderAll();
</script>
</body>
</html>
